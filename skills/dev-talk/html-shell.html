<!-- html 外殼:把 md 轉出的 HTML 塞進 <main>,{{TITLE}} 換成頁題。
     自足單檔、無外部資源、深淺色自適應。 -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root{--bg:#ffffff;--fg:#1a1a1a;--muted:#666;--line:#e2e2e2;--card:#f7f7f8;
        --ok:#0a7d33;--warn:#b57700;--bad:#c0392b;--acc:#2563eb;}
  @media(prefers-color-scheme:dark){
    :root{--bg:#141517;--fg:#e8e8e8;--muted:#9a9a9a;--line:#33363a;--card:#1e2023;
          --ok:#37c871;--warn:#e0a93e;--bad:#e46a5a;--acc:#6ea8ff;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.7 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
  main{max-width:880px;margin:0 auto;padding:32px 20px 80px}
  h1{font-size:1.5rem;border-bottom:2px solid var(--line);padding-bottom:.4em}
  h2{font-size:1.15rem;margin-top:2em}
  h3{font-size:1rem;margin-top:1.5em}
  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;margin:1em 0}
  th,td{border:1px solid var(--line);padding:6px 10px;text-align:left}
  th{background:var(--card)}
  /* 掃頁短欄:表撐滿後中文會逐字斷。著落／從哪看／看到什麼必須橫排。 */
  #scan-qs th:last-child,
  #scan-qs td:last-child{white-space:nowrap;word-break:keep-all}
  #scan-ac th:nth-child(2),
  #scan-ac td:nth-child(2),
  #scan-ac th:last-child,
  #scan-ac td:last-child{white-space:nowrap;word-break:keep-all}
  code,pre{background:var(--card);border-radius:4px;
           font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em}
  pre{padding:12px;overflow-x:auto}
  code{padding:1px 5px}
  blockquote{margin:1em 0;padding:.5em 1em;border-left:3px solid var(--line);color:var(--muted)}
  ul,ol{padding-left:1.4em}
  .meta{color:var(--muted);font-size:.85rem;margin-bottom:2em}
  .badge{display:inline-block;padding:2px 10px;border-radius:999px;
         font-size:.8rem;font-weight:600;border:1px solid transparent}
  .ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
  .warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
  .bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
  /* 掃頁:摘要卡、直式 svg 節點、問答 details。舊 class 語意不動。 */
  .sum{background:var(--card);border:1px solid var(--line);border-radius:10px;
       padding:14px 16px;margin:1em 0}
  .sum .pain{font-weight:600;margin:0 0 .4em}
  details{margin:.6em 0}
  details>summary{cursor:pointer;color:var(--muted);user-select:none}
  /* 直式現況圖:有限寬、欄內水平置中。禁 width:100% 把畫布撐滿而圖貼左。 */
  .figwrap{display:flex;justify-content:center;width:100%;margin:1.2em 0}
  svg#scan-now,.figwrap>svg{display:block;width:220px;max-width:100%;height:auto;margin:0 auto}
  pre#scan-now,.figwrap>pre{display:block;width:max-content;max-width:100%;margin:0 auto}
  svg text{font:11px -apple-system,"PingFang TC","Noto Sans TC",sans-serif;fill:var(--fg)}
  svg .b{fill:var(--card);stroke:var(--line);stroke-width:1}
  svg .hl{fill:color-mix(in srgb,var(--acc) 16%,var(--card));stroke:var(--acc)}
  svg .no{fill:color-mix(in srgb,var(--bad) 12%,var(--card));stroke:var(--bad)}
  svg .flow{fill:none;stroke:var(--muted);stroke-width:1.6}
  svg .cap{fill:var(--muted);font:11px -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
</style>
</head>
<body>
<main>
  <!-- {{CONTENT}} -->
</main>
</body>
</html>
