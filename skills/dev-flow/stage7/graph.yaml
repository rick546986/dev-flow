# 下一跳唯一正本。本機游標不進 Git。
# 乘客清單正本仍是 `_templates/7-review.md` 頂註 0–5。
# 第一刀必須有 N4-author。暫留步是 skill-legacy 真 hop,禁止 via。
# skill-legacy-2 = 模板 2／2b／2c／2d／2e。整合回歸在 Fresh 之前;
# Verdict 後改碼作廢 G3 —— 釘現有行為,不重寫工具。
entry: N0-role
nodes:
  N0-role:
    file: nodes/N0-role.md
    next: N1-matrix
    forbid:
      - write_review
      - read_notes
      - write_notes
  N1-matrix:
    file: nodes/N1-matrix.md
    next: skill-legacy-2
    forbid:
      - write_review
      - read_notes
      - write_notes
  skill-legacy-2:
    kind: skill-legacy
    entry: _templates/7-review.md
    steps: "2"
    next: N3-axes
    forbid:
      - write_review
      - read_notes
      - write_notes
  N3-axes:
    file: nodes/N3-axes.md
    next: N4-author
    forbid:
      - write_review
      - read_notes
      - write_notes
  N4-author:
    file: nodes/N4-author.md
    next: N5-verdict
    write:
      - docs/dev/<slug>/7-review.md
    write_mode: overwrite
    allow:
      - write_review
      - read_notes
    forbid:
      - write_notes
  N5-verdict:
    file: nodes/N5-verdict.md
    next: ""
    forbid:
      - write_review
      - read_notes
      - write_notes
