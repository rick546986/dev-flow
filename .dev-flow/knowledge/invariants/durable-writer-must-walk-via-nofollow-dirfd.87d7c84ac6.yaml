body: "O_NOFOLLOW 只守 pathname 最後一段。_atomic_write_dirfd 不得 os.open(abs_parent)。必須從已驗證的 .dev-flow 根握著 dirfd,用 openat + O_NOFOLLOW 逐層走到 parent,再相對該 dirfd 建暫存與 replace。檢查後把 knowledge 或 .dev-flow 換成 symlink 都必須 DurableError,樹外不得出現 yaml。"
