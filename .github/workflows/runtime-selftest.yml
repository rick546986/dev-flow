# EXTERNAL_RUNTIME 的機械驗證(hooks 行為)。
#
# 兩個層級請勿混用(與 devflow-ci.yml 對稱,兩邊都不冒充對方):
#   EXTERNAL_RUNTIME_PASS = 本 workflow 綠。只代表 hooks/ 的行為自洽。
#   REPO_REFERENCE_PASS   = devflow-ci workflow 綠(scripts/devflow-check.sh all),
#                           只代表模板/範例/fixture/契約檔自洽。
# 兩者用 devflow-contract.json 對版握手,不共用實作;一邊綠不代表另一邊綠。
#
# 2026-08-13 plugin 併入本 repo 後,不再需要 checkout 第二個 repo ——
# selftest 少數 fixture 讀 $DEVFLOW_MASTER/observability,而 MASTER 現在就是 repo root。
# gate-consistency 的比對自建暫存 fixture,不依賴外部內容。
#
# 本 workflow 不依賴任何 Secret(唯讀 checkout + 純本地檢查)。

name: runtime-selftest

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  selftest:
    name: EXTERNAL_RUNTIME (hooks/selftest.sh + gate-consistency.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show versions
        run: |
          . hooks/devflow-python-lib.sh && "$DEVFLOW_PY" --version
          git --version

      # MASTER 與 PLUGIN 併repo 後指向同一處;顯式帶入而非依賴 __file__ fallback,
      # 這樣 CI 失敗時能一眼分辨是「路徑推導壞了」還是「檢查本身紅了」。
      - name: hooks/selftest.sh
        env:
          DEVFLOW_MASTER: ${{ github.workspace }}
        run: bash hooks/selftest.sh

      - name: hooks/gate-consistency.sh
        env:
          DEVFLOW_MASTER: ${{ github.workspace }}
          DEVFLOW_PLUGIN: ${{ github.workspace }}
        run: bash hooks/gate-consistency.sh

      # 不帶任何環境變數再跑一次:證明 __file__ fallback 自己算得出 repo root。
      # 這條是 2026-08-13 那次 gate-consistency 壞掉九天沒被發現的直接回歸測試。
      - name: gate-consistency 無環境變數(__file__ fallback 回歸)
        run: env -u DEVFLOW_MASTER -u DEVFLOW_PLUGIN -u CLAUDE_PLUGIN_ROOT bash hooks/gate-consistency.sh

      # 直譯器解析回歸(D-1,2026-08-18 Windows 現場):hook 一律經
      # hooks/devflow-python-lib.sh 解析直譯器(DEVFLOW_PYTHON → /usr/bin/python3 → PATH),
      # 找不到直譯器時 fail-open(警告+exit 0),不得把使用者的宿主卡死。
      # ubuntu 上 /usr/bin/python3 永遠存在,寫死路徑的回歸在上面的 selftest 不會紅 ——
      # 所以這一步用「靜態禁寫死 + 缺直譯器行為 + 覆寫通道全套自測」三面把它釘死;
      # 任何 hook 改回 exec /usr/bin/python3,第 1 面立即紅。
      - name: 直譯器解析回歸(禁寫死路徑 + fail-open + DEVFLOW_PYTHON 覆寫)
        run: |
          set -eu
          # 1) hooks/ 內除解析正本外不得再出現寫死的 /usr/bin/python3
          if grep -rn "/usr/bin/python3" hooks/ --include="*.sh" --include="*.py" \
               | grep -v "hooks/devflow-python-lib.sh"; then
            echo "⛔ hooks/ 出現寫死的 /usr/bin/python3(解析正本以外)——Windows 回歸" >&2
            exit 1
          fi
          # 2) 缺直譯器 fail-open:警告一行 + rc=0(舊寫法無警告直接跑 impl → 這條紅)
          out=$(DEVFLOW_PYTHON=/nonexistent/python3 bash hooks/devflow-prebash.sh </dev/null 2>&1); rc=$?
          [ "$rc" -eq 0 ] || { echo "⛔ fail-open 失效:rc=$rc" >&2; exit 1; }
          case "$out" in *"找不到 python3"*) : ;; *)
            echo "⛔ 缺直譯器未走解析邏輯(無警告輸出):$out" >&2; exit 1 ;; esac
          # 3) DEVFLOW_PYTHON 覆寫通道跑整套自測(證明解析邏輯會退回/接受覆寫)
          DEVFLOW_PYTHON=$(command -v python3) bash hooks/selftest.sh
        env:
          DEVFLOW_MASTER: ${{ github.workspace }}

      - name: Scope note
        if: always()
        run: |
          echo "EXTERNAL_RUNTIME_PASS = 本 job 的結果(hooks 行為)。"
          echo "REPO_REFERENCE_PASS   = devflow-ci workflow,不在本 job 範圍。"
