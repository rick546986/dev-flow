      - docs/dev/<slug>/4-spec.md
    write_mode: overwrite
    allow:
      - write_spec
    forbid:
      - write_tasks
  skill-legacy-5:
    kind: skill-legacy
    entry: _templates/4-spec.md
    steps: "5"
    next: N6-g2
    forbid:
      - write_spec
      - write_tasks
  N6-g2:
    file: nodes/N6-g2.md
    next: N7-end
    forbid:
      - write_spec
      - write_tasks
  N7-end:
    file: nodes/N7-end.md
