<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 628" role="img"
     aria-label="七站開發流程：1 討論、2 收斂、3 原型、4 規格、5 任務、6 實作、7 驗證"
     style="display:block;max-width:360px;margin:0 auto;height:auto">
  <title>七站開發流程</title>
  <style>
    .b { fill: #f7f7f8; stroke: #e2e2e2; stroke-width: 1.4; }
    .hl { fill: #e8f0fe; stroke: #2563eb; stroke-width: 1.6; }
    .wn { fill: #fff8e6; stroke: #b57700; stroke-width: 1.6; }
    .nl { font: 700 13px -apple-system, "PingFang TC", "Noto Sans TC", "WenQuanYi Micro Hei", sans-serif; fill: #1a1a1a; }
    .sm { font: 11px -apple-system, "PingFang TC", "Noto Sans TC", "WenQuanYi Micro Hei", sans-serif; fill: #666666; }
  </style>
  <rect class="b" x="40" y="10" width="200" height="68" rx="6"/>
  <text class="nl" x="140" y="34" text-anchor="middle">1 討論</text>
  <text class="sm" x="140" y="48" text-anchor="middle">/dev-talk</text>
  <text class="sm" x="140" y="62" text-anchor="middle">1-discussion.md</text>
  <line x1="140" y1="78" x2="140" y2="100" stroke="#666666" stroke-width="1.4"/>
  <rect class="b" x="40" y="100" width="200" height="68" rx="6"/>
  <text class="nl" x="140" y="124" text-anchor="middle">2 收斂</text>
  <text class="sm" x="140" y="138" text-anchor="middle">G1 方向核准</text>
  <text class="sm" x="140" y="152" text-anchor="middle">2-decision.md</text>
  <line x1="140" y1="168" x2="140" y2="190" stroke="#666666" stroke-width="1.4"/>
  <rect class="wn" x="40" y="190" width="200" height="68" rx="6"/>
  <text class="nl" x="140" y="214" text-anchor="middle">3 原型</text>
  <text class="sm" x="140" y="228" text-anchor="middle">選配</text>
  <text class="sm" x="140" y="242" text-anchor="middle">答案回寫 2</text>
  <line x1="140" y1="258" x2="140" y2="280" stroke="#666666" stroke-width="1.4"/>
  <rect class="b" x="40" y="280" width="200" height="68" rx="6"/>
  <text class="nl" x="140" y="304" text-anchor="middle">4 規格</text>
  <text class="sm" x="140" y="318" text-anchor="middle">G2 契約核准</text>
  <text class="sm" x="140" y="332" text-anchor="middle">4-spec.md</text>
  <line x1="140" y1="348" x2="140" y2="370" stroke="#666666" stroke-width="1.4"/>
  <rect class="b" x="40" y="370" width="200" height="68" rx="6"/>
  <text class="nl" x="140" y="394" text-anchor="middle">5 任務</text>
  <text class="sm" x="140" y="408" text-anchor="middle">tracer-bullet</text>
  <text class="sm" x="140" y="422" text-anchor="middle">5-tasks.md</text>
  <line x1="140" y1="438" x2="140" y2="460" stroke="#666666" stroke-width="1.4"/>
  <rect class="hl" x="40" y="460" width="200" height="68" rx="6"/>
  <text class="nl" x="140" y="484" text-anchor="middle">6 實作</text>
  <text class="sm" x="140" y="498" text-anchor="middle">agent 跑、人握方向</text>
  <text class="sm" x="140" y="512" text-anchor="middle">6-notes</text>
  <line x1="140" y1="528" x2="140" y2="550" stroke="#666666" stroke-width="1.4"/>
  <rect class="b" x="40" y="550" width="200" height="68" rx="6"/>
  <text class="nl" x="140" y="574" text-anchor="middle">7 驗證</text>
  <text class="sm" x="140" y="588" text-anchor="middle">G3 出貨核准</text>
  <text class="sm" x="140" y="602" text-anchor="middle">7-review.md</text>
</svg>
