<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" role="img"
     aria-label="五站流程圖：Intake→Decide→Spec→Build→Ship，只有 Ship 是預設人類停點">
  <title>五站流程圖：Intake→Decide→Spec→Build→Ship，只有 Ship 是預設人類停點</title>
  <style>
    svg {
      --bg: #ffffff; --fg: #1a1a1a; --muted: #666; --line: #e2e2e2; --card: #f7f7f8;
      --ok: #0a7d33; --warn: #b57700; --bad: #c0392b; --acc: #2563eb;
      --opus: #7c3aed; --sonnet: #0d9488; --haiku: #57606a;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #141517; --fg: #e8e8e8; --muted: #9a9a9a; --line: #33363a; --card: #1e2023;
        --ok: #37c871; --warn: #e0a93e; --bad: #e46a5a; --acc: #6ea8ff;
        --opus: #a78bfa; --sonnet: #2dd4bf; --haiku: #9aa4af;
      }
    }
    .b { fill: var(--card); stroke: var(--line); stroke-width: 1; }
    .hl { fill: color-mix(in srgb, var(--acc) 16%, var(--card)); stroke: var(--acc); }
    .go { fill: color-mix(in srgb, var(--ok) 14%, var(--card)); stroke: var(--ok); }
    .m-opus { fill: color-mix(in srgb, var(--opus) 18%, var(--card)); stroke: var(--opus); }
    .m-sonnet { fill: color-mix(in srgb, var(--sonnet) 18%, var(--card)); stroke: var(--sonnet); }
    .m-haiku { fill: color-mix(in srgb, var(--haiku) 18%, var(--card)); stroke: var(--haiku); }
    .edge { fill: none; stroke: var(--muted); stroke-width: 1.5; }
    .arrowhead { fill: var(--muted); }
    .sessionbox { fill: none; stroke: var(--acc); stroke-dasharray: 4 3; stroke-width: 1.4; }
    .dt { font: 11px -apple-system, "PingFang TC", "Noto Sans TC", "WenQuanYi Micro Hei", sans-serif; fill: var(--fg); }
    .dc { font: 9px -apple-system, "PingFang TC", "Noto Sans TC", "WenQuanYi Micro Hei", sans-serif; fill: var(--muted); }
    .dl { font: 10px -apple-system, "PingFang TC", "Noto Sans TC", "WenQuanYi Micro Hei", sans-serif; fill: var(--muted); }
    .dk { font: 700 10px -apple-system, "PingFang TC", "Noto Sans TC", "WenQuanYi Micro Hei", sans-serif; fill: var(--acc); }
  </style>
  <rect x="0" y="0" width="880" height="220" fill="var(--bg)"/>
  <defs>
    <marker id="ar-fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 Z"/>
    </marker>
  </defs>
  <g class="cluster"><rect x="122" y="48" width="116" height="78" rx="10" class="sessionbox"/></g>
  <g class="n"><rect x="6" y="58" width="108" height="58" rx="26" class="b"/><text class="dt" x="16" y="78">想法/需求</text><text class="dc" x="16" y="94">還沒有任何檔案</text></g>
  <g class="n"><rect x="126" y="58" width="108" height="58" rx="6" class="m-opus"/><text class="dt" x="136" y="74">Intake</text><text class="dc" x="136" y="89">/dev-talk</text><text class="dc" x="136" y="103">1-discussion.md</text></g>
  <g class="n"><rect x="246" y="58" width="108" height="58" rx="6" class="m-opus"/><text class="dt" x="256" y="74">Decide</text><text class="dc" x="256" y="89">繼續 · OC 即 hop</text><text class="dc" x="256" y="103">2-decision.md</text></g>
  <g class="n"><rect x="366" y="58" width="108" height="58" rx="6" class="m-opus"/><text class="dt" x="376" y="74">Spec</text><text class="dc" x="376" y="89">UI 才做原型</text><text class="dc" x="376" y="103">4-spec.md</text></g>
  <g class="n"><rect x="486" y="58" width="108" height="58" rx="6" class="m-haiku"/><text class="dt" x="496" y="74">Build</text><text class="dc" x="496" y="89">dev-run · 四欄</text><text class="dc" x="496" y="103">5-tasks + 6-notes</text></g>
  <g class="n"><rect x="606" y="58" width="108" height="58" rx="6" class="hl"/><text class="dt" x="616" y="74">Ship</text><text class="dc" x="616" y="89">預設人類停點</text><text class="dc" x="616" y="103">7-review.md</text></g>
  <g class="n"><rect x="726" y="58" width="148" height="58" rx="6" class="go"/><text class="dt" x="736" y="74">PR</text><text class="dc" x="736" y="89">verdict 人類親寫</text><text class="dc" x="736" y="103">才准開</text></g>
  <path class="edge" marker-end="url(#ar-fl)" d="M114,87 L126,87"/>
  <path class="edge" marker-end="url(#ar-fl)" d="M234,87 L246,87"/>
  <path class="edge" marker-end="url(#ar-fl)" d="M354,87 L366,87"/>
  <path class="edge" marker-end="url(#ar-fl)" d="M474,87 L486,87"/>
  <path class="edge" marker-end="url(#ar-fl)" d="M594,87 L606,87"/>
  <path class="edge" marker-end="url(#ar-fl)" d="M714,87 L726,87"/>
  <text class="dk" x="126" y="42">必開新 session</text>
  <text class="dk" x="606" y="42">唯一人類必停</text>
  <text class="dl" x="16" y="148">新工作預設這五站。紫 = 規劃、灰 = 起步/執行、藍框 = 預設等人。Intake 無人停；Decide 的 G1 物質留下但不例行等人；Spec 只有 UI trigger 才 latch Demo；Build 無人停。</text>
  <text class="dl" x="16" y="168">Ship 的 verdict 由人類親寫，agent 不得發明 G3。舊七檔名仍是機器別名（1–7 不動）。</text>
  <text class="dl" x="16" y="196">次要：已開工 in-flight 票仍 dual-read 舊七站，直到該 slug Ship。這不是第一張圖要教的路。</text>
</svg>
